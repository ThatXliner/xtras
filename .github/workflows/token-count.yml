name: Token Count

on:
  push:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
      - ".github/workflows/token-count.yml"
      - ".github/scripts/count-tokens.mjs"
  pull_request:
    paths:
      - "skills/**/SKILL.md"
      - ".github/workflows/token-count.yml"
      - ".github/scripts/count-tokens.mjs"

jobs:
  count-tokens:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Install tiktoken
        run: npm install --no-save tiktoken

      - name: Count tokens for every skill
        run: node .github/scripts/count-tokens.mjs token-counts

      - name: Update badge gist
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.BADGE_GIST_ID }}
        run: |
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            --data-binary @token-counts/gist-patch.json > /dev/null

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fs.readFileSync('token-counts/summary.md', 'utf8'),
            });
